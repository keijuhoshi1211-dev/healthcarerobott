.lk svg{flex:none;width:18px;height:18px}

.lk.s{background:var(--card);color:var(--sub);border-color:var(--line);box-shadow:none}
.note{font-size:11.5px;color:var(--sub);margin:0 2px 10px;line-height:1.5}
